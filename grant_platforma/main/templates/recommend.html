<!DOCTYPE html>
<html>
<head>
    <title>Mos grantlar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h2 class="text-center text-primary mb-4">📊 Mos grantlar</h2>

    {% if student %}
    <div class="card shadow p-3 mb-4">
        <h5>👤 Talaba: {{ student.name }}</h5>
        <p>📊 GPA: {{ student.gpa }}</p>
    </div>
    {% endif %}

    <div class="row">

        {% for g in grants %}
        <div class="col-md-4">
            <div class="card shadow-sm border-success p-3 mb-3">
                <h5>🏆 {{ g.title }}</h5>
                <p>🎯 Min GPA: {{ g.min_gpa }}</p>
                <p>📚 Yo‘nalish: {{ g.field }}</p>
            </div>
        </div>
        {% empty %}
        <div class="alert alert-danger text-center">
            ❌ Mos grant topilmadi
        </div>
        {% endfor %}

    </div>

    <div class="text-center mt-3">
        <a href="/" class="btn btn-secondary">⬅️ Orqaga</a>
    </div>

</div>

</body>
</html>
